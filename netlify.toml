[build]
  base = "."
  publish = "landing-page"

[dev]
  command = "pnpm dev"
  targetPort = 1420

[[edge_functions]]
  function = "accept-markdown"
  path = "/*"

[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "all"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Signal = "search=yes, ai-input=yes, ai-train=no"

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </docs.html>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="agent-skills", </.well-known/mcp/server-card.json>; rel="mcp-server-card", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource", </auth.md>; rel="auth-md", </.well-known/dns-aid.json>; rel="dns-aid"'

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </docs.html>; rel="service-doc", </.well-known/agent-skills/index.json>; rel="agent-skills", </.well-known/mcp/server-card.json>; rel="mcp-server-card", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource", </auth.md>; rel="auth-md", </.well-known/dns-aid.json>; rel="dns-aid"'

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[redirects]]
  from = "https://www.atglance.app/*"
  to = "https://atglance.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://atglance.app/*"
  to = "https://atglance.app/:splat"
  status = 301
  force = true

# Legacy Domain Entity Purge (Historical News/Studio URLs)
[[redirects]]
  from = "/articles/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/studio"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/submit-article"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/leaderboard"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/trending"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/sources"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/change-logs"
  to = "/410.html"
  status = 410
  force = true

