name: CI

on:
  push:
    branches: [main, master, product-hunt-landing-variant]
    tags: ['v*']
    paths-ignore:
      - 'landing-page/**'
  pull_request:
    paths-ignore:
      - 'landing-page/**'
  workflow_dispatch:

jobs:
  behavior-critical-macos:
    if: "!contains(github.event.head_commit.message, '[skip gha]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Run critical frontend behavior tests
        run: pnpm exec vitest run --config vitest.behavior.config.ts src/test/behavior/critical

      - name: Ensure frontendDist exists for Rust compile
        run: 'node -e "require(''fs'').mkdirSync(''dist'', { recursive: true })"'

      - name: Run runtime contract tests (retry once)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cargo test --manifest-path src-tauri/Cargo.toml runtime_

  behavior-critical-windows:
    if: "!contains(github.event.head_commit.message, '[skip gha]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Run critical frontend behavior tests
        run: pnpm exec vitest run --config vitest.behavior.config.ts src/test/behavior/critical

      - name: Ensure frontendDist exists for Rust compile
        run: 'node -e "require(''fs'').mkdirSync(''dist'', { recursive: true })"'

      - name: Run runtime contract tests (retry once)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: cargo test --manifest-path src-tauri/Cargo.toml runtime_

  rust-tests:
    if: "!contains(github.event.head_commit.message, '[skip gha]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Tauri)
        shell: bash
        run: |
          sudo apt-get update
          WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          if ! apt-cache show "$WEBKIT_PKG" >/dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            "$WEBKIT_PKG" \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Ensure frontendDist exists for Rust compile
        run: mkdir -p dist

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    if: "(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !contains(github.event_head_commit.message, '[skip gha]')"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.ref_name, '-ph.') && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"msi,nsis"}]' || '[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"dmg,app"},{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"dmg,app"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"msi,nsis"}]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Resolve build channel
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v__VERSION__" >> "$GITHUB_ENV"
          fi
          if [[ "${GITHUB_REF_NAME}" == *"-ph."* ]] || [[ "${GITHUB_REF_NAME}" == "product-hunt-landing-variant" ]]; then
            echo "GLANCE_BUILD_CHANNEL=product_hunt" >> "$GITHUB_ENV"
            echo "VITE_GLANCE_BUILD_CHANNEL=product_hunt" >> "$GITHUB_ENV"
            echo "TAURI_CONFIG_PATH=src-tauri/tauri.product-hunt.conf.json" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Glance Trial v__VERSION__" >> "$GITHUB_ENV"
            echo "RELEASE_BODY=See the attached assets to download and install Glance Trial." >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "GLANCE_BUILD_CHANNEL=paid" >> "$GITHUB_ENV"
            echo "VITE_GLANCE_BUILD_CHANNEL=paid" >> "$GITHUB_ENV"
            echo "TAURI_CONFIG_PATH=src-tauri/tauri.conf.json" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Glance v__VERSION__" >> "$GITHUB_ENV"
            echo "RELEASE_BODY=See the attached assets to download and install Glance." >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: pnpm run build
        env:
          VITE_GLANCE_BUILD_CHANNEL: ${{ env.VITE_GLANCE_BUILD_CHANNEL }}

      - name: Inspect macOS signing certificate
        if: runner.os == 'macOS'
        id: macos_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -uo pipefail

          # Tauri derives the signing identity from APPLE_CERTIFICATE itself and fails with an
          # opaque "failed to resolve signing identity" when the .p12 yields no code-signing
          # identity. Import it here first so the log shows what the secret actually contains.
          fail_or_warn() {
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1 Building unsigned (--no-sign) because this is not a tag release."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            fail_or_warn "APPLE_CERTIFICATE secret is empty."
          fi

          work=$(mktemp -d)
          kc="$work/preflight.keychain-db"
          trap 'security delete-keychain "$kc" 2>/dev/null || true; rm -rf "$work"' EXIT

          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$work/cert.p12" 2>/dev/null; then
            fail_or_warn "APPLE_CERTIFICATE is not valid base64."
          fi

          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security unlock-keychain -p "$pw" "$kc"
          if ! security import "$work/cert.p12" -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
               -T /usr/bin/codesign -k "$kc" 2>&1; then
            fail_or_warn "Could not import APPLE_CERTIFICATE (wrong APPLE_CERTIFICATE_PASSWORD, or corrupt .p12)."
          fi

          echo "--- code-signing identities inside APPLE_CERTIFICATE ---"
          identities=$(security find-identity -v -p codesigning "$kc" 2>/dev/null || true)
          echo "${identities:-<none>}"

          devid=$(printf '%s\n' "$identities" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -n "$devid" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing + notarizing with: $devid"
            exit 0
          fi

          other=$(printf '%s\n' "$identities" | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$other" ]; then
            fail_or_warn "APPLE_CERTIFICATE imported but contains NO code-signing identity. Re-export the .p12 by selecting the *certificate* row in Keychain Access (it nests its private key) - not the private-key row alone."
          else
            fail_or_warn "APPLE_CERTIFICATE contains '$other', which is not a 'Developer ID Application' certificate. Apple will not notarize it and Gatekeeper will reject the DMG."
          fi

      - name: Build Tauri (non-Windows)
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLANCE_LICENSE_PUBLIC_KEY: ${{ secrets.GLANCE_LICENSE_PUBLIC_KEY }}
          GLANCE_BUILD_CHANNEL: ${{ env.GLANCE_BUILD_CHANNEL }}
          VITE_GLANCE_BUILD_CHANNEL: ${{ env.VITE_GLANCE_BUILD_CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        with:
          args: --config ${{ env.TAURI_CONFIG_PATH }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}${{ steps.macos_signing.outputs.mode == 'developer-id' && '' || ' --no-sign' }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ env.IS_PRERELEASE }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Build Tauri (Windows first attempt)
        if: runner.os == 'Windows'
        id: tauri_windows_attempt_1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLANCE_LICENSE_PUBLIC_KEY: ${{ secrets.GLANCE_LICENSE_PUBLIC_KEY }}
          GLANCE_BUILD_CHANNEL: ${{ env.GLANCE_BUILD_CHANNEL }}
          VITE_GLANCE_BUILD_CHANNEL: ${{ env.VITE_GLANCE_BUILD_CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --config ${{ env.TAURI_CONFIG_PATH }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ env.IS_PRERELEASE }}

      - name: Build Tauri (Windows retry)
        if: runner.os == 'Windows' && steps.tauri_windows_attempt_1.outcome == 'failure'
        id: tauri_windows_attempt_2
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLANCE_LICENSE_PUBLIC_KEY: ${{ secrets.GLANCE_LICENSE_PUBLIC_KEY }}
          GLANCE_BUILD_CHANNEL: ${{ env.GLANCE_BUILD_CHANNEL }}
          VITE_GLANCE_BUILD_CHANNEL: ${{ env.VITE_GLANCE_BUILD_CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --config ${{ env.TAURI_CONFIG_PATH }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ env.IS_PRERELEASE }}

      - name: Build Tauri (Windows final retry)
        if: runner.os == 'Windows' && steps.tauri_windows_attempt_2.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLANCE_LICENSE_PUBLIC_KEY: ${{ secrets.GLANCE_LICENSE_PUBLIC_KEY }}
          GLANCE_BUILD_CHANNEL: ${{ env.GLANCE_BUILD_CHANNEL }}
          VITE_GLANCE_BUILD_CHANNEL: ${{ env.VITE_GLANCE_BUILD_CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --config ${{ env.TAURI_CONFIG_PATH }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ env.IS_PRERELEASE }}

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
